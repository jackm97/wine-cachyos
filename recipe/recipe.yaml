# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: "11.0"

package:
  name: photolab-wine
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    interpreter: nu
    file: build.nu

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    # Sets -march=x86-64-v3 in the conda gcc CFLAGS/CXXFLAGS (Unix side).
    - x86_64-microarch-level ==3
    # PE toolchain: clang compiles; lld-link links; llvm-tools gives winebuild llvm-dlltool/ar/ranlib/windres.
    - clang
    - lld
    - llvm-tools
    - autoconf
    - perl
    - python
    - bison
    - flex
    - make
    - pkg-config
    - gettext
    - wayland
    - nushell
  # Run deps come from the host packages' run_exports; Wine dlopens most of
  # these, which is why they are host deps.
  host:
    - xorg-libx11
    - xorg-libxext
    - xorg-libxcursor
    - xorg-libxi
    - xorg-libxxf86vm
    - xorg-libxrender
    - xorg-libxrandr
    - xorg-libxfixes
    - xorg-libxinerama
    - xorg-libxcomposite
    - libgl-devel
    - libegl-devel
    - libgles-devel
    - wayland
    - libxkbcommon
    - libvulkan-headers
    - libvulkan-loader
    - ocl-icd
    - opencl-headers
    - libdrm
    - libhwloc
    - gnutls
    - gmp
    - libgcrypt
    - krb5
    - freetype
    - fontconfig
    - dbus
    - libudev
    - libusb
    - alsa-lib
    - pulseaudio-client
    - pipewire
    - gstreamer
    - gst-plugins-base
    - ffmpeg
    - sdl2
    - libunwind
    - zlib
    # dlls/wineopenxr links its Unix side against libopenxr_loader (UNIX_LIBS = -lopenxr_loader).
    - openxr-sdk
  # They are declared as build-dependencies in pixi.toml so the recipe can name them.
  run:
    - dxvk
    - vkd3d-proton
    - winetricks
    - windows-winmd

tests:
  - script:
      interpreter: nu
      content:
        - wine --version
    requirements:
      run:
        - nushell

about:
  homepage: https://github.com/jackm97/wine-cachyos
  license: LGPL-2.1-or-later
  summary: Wine 11.0 (CachyOS fork, photolab branch) for DxO PhotoLab
