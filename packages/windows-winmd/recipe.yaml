# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: "0.62.0"

package:
  name: windows-winmd
  version: ${{ version }}

# tag 74+ strips runtime-class members (no .ctor), which the CLR needs.
source:
  url: https://raw.githubusercontent.com/microsoft/windows-rs/${{ version }}/crates/libs/bindgen/default/Windows.winmd
  sha256: aea3e9828927aedd1ace2b927911e826f386d5c52dc6bd4151c10d314cb1adbf
  file_name: Windows.winmd

build:
  number: 0
  noarch: generic
  script:
    interpreter: nu
    content: |
      # Microsoft's combined WinRT metadata; wine.inf copies it into each prefix's system32/winmetadata.
      let dst = ($env.PREFIX | path join share wine winmd)
      mkdir $dst
      cp ($env.SRC_DIR | path join Windows.winmd) ($dst | path join Windows.winmd)

requirements:
  build:
    - nushell

about:
  homepage: https://github.com/microsoft/windows-rs
  license: MIT OR Apache-2.0
  summary: Microsoft's combined Windows.winmd WinRT metadata, as published by windows-rs
